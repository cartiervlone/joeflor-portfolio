<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Joeflor Hinobiada — Video Editor & Post-Production Specialist</title>
    <meta name="description" content="Portfolio of Joeflor Hinobiada — video editor, post-production specialist, content creator, and podcast video editor." />
    <meta name="author" content="Joeflor Hinobiada" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#070B14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="preload" as="image" href="/avatar.svg" fetchpriority="high" media="(min-width: 1100px)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joeflor Hinobiada" />
    <meta property="og:title" content="Joeflor Hinobiada — Video Editor" />
    <meta property="og:description" content="Video editing, post-production, podcast, YouTube, social, gaming montage, and cinematic work." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#070B14');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
